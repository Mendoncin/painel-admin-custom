{% extends 'base.html' %}

{% block content %}
<h1>Lista de gêneros <a style="float: right;" href="{% url 'catalog:criar-generos' %}">+</a></h1>
{% if genres %}
<ul>
  {% for genre in genres %}
  <li>{{genre.name}}</li>
  {% endfor %}
</ul>
{% else %}
<p>Não há generos aqui</p>
{% endif %}
{% endblock %}
